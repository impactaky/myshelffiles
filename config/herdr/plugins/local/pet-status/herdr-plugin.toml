id = "pet-status"
name = "Pet status"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Show each agent and space state as a pet icon through $pet_<status> sidebar tokens."
platforms = ["linux"]

# Every entry runs the same idempotent reconcile over all panes.
[[startup]]
command = ["python3", "pet_status.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "pet_status.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "pet_status.py"]

[[events]]
on = "pane.created"
command = ["python3", "pet_status.py"]

[[events]]
on = "workspace.created"
command = ["python3", "pet_status.py"]
